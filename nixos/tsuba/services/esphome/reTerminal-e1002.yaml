substitutions:
  name: e1002
  friendly_name: "reTerminal E1002"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 600
      then:
        - output.turn_on: bsp_sd_enable
        - output.turn_on: bsp_battery_enable
        - delay: 200ms
        - component.update: battery_voltage
        - component.update: battery_level
        - light.turn_on: onboard_led
    - priority: -100
      then:
        - delay: 5s
        - script.execute: update_display_from_selector

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0 # Required to report logs over USB on this device
  
api:
  encryption:
    key: !secret reterminal_e1002_enc_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9
i2c:
  scl: GPIO20
  sda: GPIO19

globals:
  - id: page_index
    type: int
    restore_value: true
    initial_value: '0'

sensor:
  - platform: sht4x
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Relative Humidity"
      id: hum_sensor
    update_interval: 90s
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 90s
    attenuation: 12db
    filters:
      - multiply: 2.0
    on_value:
      then:
        - component.update: battery_level
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    lambda: 'return id(battery_voltage).state;'
    update_interval: never
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

output:
  - platform: gpio
    pin: GPIO6
    id: bsp_led
    inverted: true
  - platform: gpio
    pin: GPIO16
    id: bsp_sd_enable
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

light:
  - platform: binary
    name: "Onboard LED"
    output: bsp_led
    id: onboard_led
    internal: true

time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: "Europe/Dublin"

text_sensor:
  - platform: homeassistant
    id: ha_page_selector
    entity_id: input_select.reterminal_e1002_page_selector
    internal: true
    on_value:
      then:
        - script.execute: update_display_from_selector
  - platform: version
    hide_timestamp: true
    name: "${friendly_name} ESPHome Version"
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      icon: mdi:wifi
      entity_category: diagnostic
      id: sensorip
    ssid:
      name: "${friendly_name} Connected SSID"
      icon: mdi:wifi-strength-2
      entity_category: diagnostic
      id: sensorssid

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: right
    name: "Right"
    internal: true
    on_press:
      then:
        - lambda: |-
            id(page_index) = (id(page_index) + 1) % 4;
        - if:
            condition:
              lambda: 'return id(page_index) == 0;'
            then:
              - component.update: dashboard_image_home
        - if:
            condition:
              lambda: 'return id(page_index) == 1;'
            then:
              - component.update: dashboard_image_energy
        - if:
            condition:
              lambda: 'return id(page_index) == 2;'
            then:
              - component.update: dashboard_image_plants
        - if:
            condition:
              lambda: 'return id(page_index) == 3;'
            then:
              - component.update: dashboard_image_wallpaper

  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: left
    name: "Left"
    internal: true
    on_press:
      then:
        - lambda: |-
            id(page_index) = (id(page_index) - 1 + 4) % 4;
        - if:
            condition:
              lambda: 'return id(page_index) == 0;'
            then:
              - component.update: dashboard_image_home
        - if:
            condition:
              lambda: 'return id(page_index) == 1;'
            then:
              - component.update: dashboard_image_energy
        - if:
            condition:
              lambda: 'return id(page_index) == 2;'
            then:
              - component.update: dashboard_image_plants
        - if:
            condition:
              lambda: 'return id(page_index) == 3;'
            then:
              - component.update: dashboard_image_wallpaper

http_request:
  verify_ssl: false
  timeout: 10s
  watchdog_timeout: 15s

script:
  - id: update_display_from_selector
    mode: restart
    then:
      - lambda: |-
          std::string page_selection = id(ha_page_selector).state;
          ESP_LOGI("selector", "Page changed to: %s", page_selection.c_str());

          if (page_selection == "home") {
            id(page_index) = 0;
          } else if (page_selection == "energy") {
            id(page_index) = 1;
          } else if (page_selection == "plants") {
            id(page_index) = 2;
          } else if (page_selection == "wallpaper") {
            id(page_index) = 3;
          } else {
            ESP_LOGW("selector", "Unknown value, defaulting to home");
            id(page_index) = 0;
          }
      - delay: 200ms
      - lambda: |-
          switch(id(page_index)) {
            case 0: id(dashboard_image_home).update(); break;
            case 1: id(dashboard_image_energy).update(); break;
            case 2: id(dashboard_image_plants).update(); break;
            case 3: id(dashboard_image_wallpaper).update(); break;
            default: id(dashboard_image_home).update();
          }

online_image:
  - id: dashboard_image_home
    format: PNG
    type: RGB565
    buffer_size: 65536
    url: http://192.168.0.125:10000/eink-e1002/home?device=seeed-reterminal-e1002
    update_interval: never
    on_download_finished:
      - delay: 100ms
      - component.update: epaper_display

  - id: dashboard_image_energy
    format: PNG
    type: RGB565
    buffer_size: 65536
    url: http://192.168.0.125:10000/eink-e1002/energy?device=seeed-reterminal-e1002
    update_interval: never
    on_download_finished:
      - delay: 100ms
      - component.update: epaper_display

  - id: dashboard_image_plants
    format: PNG
    type: RGB565
    buffer_size: 65536
    url: http://192.168.0.125:10000/eink-e1002/plants?device=seeed-reterminal-e1002
    update_interval: never
    on_download_finished:
      - delay: 100ms
      - component.update: epaper_display

  - id: dashboard_image_wallpaper
    format: PNG
    type: RGB565
    buffer_size: 65536
    url: http://192.168.0.125:10000/eink-e1002/wallpaper?device=seeed-reterminal-e1002
    update_interval: never
    on_download_finished:
      - delay: 100ms
      - component.update: epaper_display

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    full_update_every: 10
    lambda: |-
      if (id(page_index) == 0) {
        it.image(0, 0, id(dashboard_image_home));
      } else if (id(page_index) == 1) {
        it.image(0, 0, id(dashboard_image_energy));
      } else if (id(page_index) == 2) {
        it.image(0, 0, id(dashboard_image_plants));
      } else if (id(page_index) == 3) {
        it.image(0, 0, id(dashboard_image_wallpaper));
      }
